<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Flujo en cinco etapas. El atacante crea un Business falso e inyecta un enlace m.me en el campo de nombre. Meta envia la notificacion legitima, que pasa SPF, DKIM y DMARC. Llega a la bandeja sin IOCs tradicionales. La victima es llevada a Messenger para ingenieria social. Resultado: secuestro de activos y extorsion.</desc>
